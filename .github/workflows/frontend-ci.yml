name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'stb-frontend/stb-frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'stb-frontend/stb-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stb-frontend/stb-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./stb-frontend/stb-frontend
        run: npm ci

      - name: Run tests
        working-directory: ./stb-frontend/stb-frontend
        run: npm test -- --watchAll=false

      - name: Build production bundle
        working-directory: ./stb-frontend/stb-frontend
        run: npm run build